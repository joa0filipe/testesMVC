<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Web com Java</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        form { margin-bottom: 20px; }
        input, select, button { padding: 10px; font-size: 16px; margin: 5px; }
    </style>
</head>
<body>

<h1>Calculadora do trem</h1>

<!-- O formulário envia os números para o /calcular -->
<form action="/calcular" method="GET">
    <input type="number" step="any" name="num1" required placeholder="1º número">

    <select name="operacao">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">x</option>
        <option value="/">/</option>
    </select>

    <input type="number" step="any" name="num2" required placeholder="2º número">

    <button type="submit">Calcular</button>
</form>

<hr>

<h2>Resultado: <span style="color: #000000;" th:text="${resultado}">0</span></h2>

</body>
</html>
